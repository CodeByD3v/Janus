# .github/workflows/ci.yml — lint, typecheck, eval suite
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Linting ───────────────────────────────────────────
      - name: Ruff check
        run: ruff check .

      - name: Mypy typecheck
        run: mypy --ignore-missing-imports .

      # ── Complete unit/regression evaluation matrix ─────────
      # Expand the shell glob so every evals/eval_*.py module runs. The
      # integration-marked suites remain collected but skipped here unless a
      # real external credential is supplied in their dedicated step below.
      # This prevents newer regression modules from silently disappearing
      # from CI when a maintainer forgets to add another explicit step.
      - name: Eval — all unit and regression modules
        env:
          GOOGLE_API_KEYS: "ci-dummy-key-a,ci-dummy-key-b"
        run: pytest evals/eval_*.py -v -m "not integration"

      # ── Integration tests (require GOOGLE_API_KEY) ────────
      - name: Eval — reviewer (integration)
        # A step's own `env:` block is not available to that same step's
        # `if:` condition — only workflow/job-level env vars are. This
        # must check `secrets` directly, or the step silently never runs
        # even when GOOGLE_API_KEY is genuinely configured. (Found while
        # auditing this file: the previous `env.GOOGLE_API_KEY != ''`
        # form always evaluates false, since nothing sets that env var
        # before this condition is checked.)
        if: ${{ secrets.GOOGLE_API_KEY != '' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: pytest evals/eval_reviewer.py -v -m integration
