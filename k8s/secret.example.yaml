# Template only: do not apply this file with placeholder values.
# Create the Secret from a deployment secret manager, for example:
# kubectl -n janus create secret generic janus-runtime-secrets \
#   --from-literal=DATABASE_URL='postgresql+psycopg2://janus:<password>@janus-postgres:5432/janus' \
#   --from-literal=GOOGLE_API_KEYS='key-one,key-two' \
#   --from-literal=API_KEYS='tenant-key:tenant-id' \
#   --from-literal=ADMIN_API_KEYS='operator-key:operator-id'
apiVersion: v1
kind: Secret
metadata:
  name: janus-runtime-secrets
  namespace: janus
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-random-database-password
  DATABASE_URL: postgresql+psycopg2://janus:replace-me@janus-postgres:5432/janus
  GOOGLE_API_KEYS: replace-with-google-key-pool
  API_KEYS: replace-with-tenant-key:tenant-id
  ADMIN_API_KEYS: replace-with-admin-key:operator-id
  GITHUB_WEBHOOK_SECRET: replace-if-github-app-webhooks-enabled
  GITHUB_APP_ID: replace-if-github-app-mode-enabled
  GITHUB_APP_PRIVATE_KEY: replace-if-github-app-mode-enabled
  BYOK_ENCRYPTION_KEY: replace-if-byok-is-enabled
