apiVersion: v1
kind: Service
metadata:
  name: janus-postgres
  labels:
    app.kubernetes.io/name: janus-postgres
    app.kubernetes.io/part-of: janus-adversarial-review
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: janus-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: janus-postgres
  labels:
    app.kubernetes.io/name: janus-postgres
    app.kubernetes.io/part-of: janus-adversarial-review
spec:
  serviceName: janus-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: janus-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: janus-postgres
        app.kubernetes.io/part-of: janus-adversarial-review
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: janus
            - name: POSTGRES_DB
              value: janus
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: janus-runtime-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U janus -d janus"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U janus -d janus"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
