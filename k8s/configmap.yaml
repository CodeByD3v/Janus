apiVersion: v1
kind: ConfigMap
metadata:
  name: janus-config
  labels:
    app.kubernetes.io/name: janus
data:
  ALLOWED_REPO_ROOTS: /app/repos
  USE_CONTAINERIZED_GATE: "true"
  # Replace the tag with the exact immutable sandbox image released alongside
  # the service image. Kustomize image transforms do not rewrite ConfigMap data.
  SANDBOX_IMAGE: ghcr.io/codebyd3v/janus/sandbox:replace-with-git-sha
  CHROMA_PERSIST_DIR: /app/chroma_store
  GITHUB_REPO_CACHE_DIR: /app/repos/.github-cache
  LOG_LEVEL: INFO
  WORKER_MAX_CONCURRENT: "4"
  WORKER_POLL_INTERVAL: "5"
  ADV_REVIEW_MAX_ROUNDS: "5"
  ADV_REVIEW_CIRCUIT_FAILURE_THRESHOLD: "5"
  ADV_REVIEW_CIRCUIT_COOLDOWN_SECONDS: "60"
  LLM_CALL_TIMEOUT_SECONDS: "180"
  ZOMBIE_SESSION_TIMEOUT_MINUTES: "30"
  ZOMBIE_SWEEP_INTERVAL_SECONDS: "300"
