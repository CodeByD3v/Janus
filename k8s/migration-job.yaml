apiVersion: batch/v1
kind: Job
metadata:
  name: janus-migrate
  labels:
    app.kubernetes.io/name: janus-migrate
    app.kubernetes.io/part-of: janus-adversarial-review
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: janus-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: janus-service
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - from storage.db import run_migrations; run_migrations()
          envFrom:
            - configMapRef:
                name: janus-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: janus-runtime-secrets
                  key: DATABASE_URL
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
